# Dependabot version updates. Copy to .github/dependabot.yml and keep the
# ecosystems this repo uses (one entry per ecosystem and directory). From
# https://github.com/InboundFrog/repo-tools/blob/main/examples/dependabot.yml
#
# github-actions covers the `uses:` pins in .github/workflows/ci.yml too, so a
# new repo-tools release arrives as a PR here after the cooldown. Minor and
# patch updates share one PR per ecosystem; majors get their own. To hold a
# dependency back, add to its entry:
#   ignore:
#     - dependency-name: rand
#       update-types: ['version-update:semver-major', 'version-update:semver-minor']
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv            # projects with a uv.lock; otherwise pip
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip           # pyproject.toml, setup.py, Pipfile, requirements*.txt
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: maven
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform     # one entry per directory with .tf files
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker        # directories with a Dockerfile
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
