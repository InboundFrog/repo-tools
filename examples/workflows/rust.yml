# CI for this repo, via the reusable workflows in InboundFrog/repo-tools:
# https://github.com/InboundFrog/repo-tools (examples/workflows has one of
# these per language, and polyglot.yml for several). Copy it to
# .github/workflows/ci.yml and edit the `with:` block; every input is listed in
# that README. The commented lines are the inputs most often changed.
#
# The `uses:` line pins a release by commit SHA, with the tag in a comment, so
# Dependabot (examples/dependabot.yml) proposes each newer release. Keep the
# final "CI OK" job: it is the one check branch protection requires.
name: CI

on:
  pull_request:
  push:
    branches: [main]   # the default branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: InboundFrog/repo-tools/.github/workflows/rust.yml@bf24833e55abb4f21a6061c41f045efb4963181d # v0.1.0
    with:
      working-directory: .
      # toolchain: "1.96"            # else rust-toolchain(.toml), else stable
      # apt-packages: libudev-dev libusb-1.0-0-dev pkg-config
      # build-command: cargo build --release --locked
      # artifact-paths: target/release/mytool
      # artifact-name: mytool
      # audit-command: skip          # cargo audit, in its own job
      # msrv-command: skip           # cargo check on Cargo.toml's rust-version, in its own job
      # extra-command: ci/smoke.sh

  ci-ok:
    name: CI OK
    if: always()
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
