# Copy to .github/repo-tools.conf in a target repo, then re-run repo-ci /
# repo-dependabot. Plain KEY=VALUE lines; nothing here is executed by the
# scripts. Lists are comma or space separated. Everything is optional.

# --- CI ----------------------------------------------------------------------

# Languages to run, replacing auto-detection:
#   python node rust gradle maven terraform ansible shell
# LANGUAGES=python,shell

# Drop languages from the detected set.
# EXCLUDE=shell

# Directories a language's job runs in (one matrix entry each).
# PYTHON_DIRS=services/api,tools/cli
# NODE_DIRS=web

# Toolchain versions (otherwise taken from .python-version, .nvmrc,
# .java-version / .sdkmanrc, .terraform-version, or a sensible default).
# PYTHON_VERSION=3.12
# NODE_VERSION=22
# JAVA_VERSION=17
# TERRAFORM_VERSION=1.9.8

# Replace a step's default command, or "skip" it. Key: <LANGUAGE>_<LINT|TEST|BUILD>.
# The command runs in the job's working directory.
# PYTHON_LINT=ruff check src
# PYTHON_TEST=pytest -m "not slow"
# NODE_BUILD=skip
# GRADLE_LINT=./gradlew ktlintCheck detekt
# MAVEN_LINT=./mvnw -B -ntp checkstyle:check
# TERRAFORM_TEST=skip
# ANSIBLE_TEST=molecule test

# --- Dependabot ----------------------------------------------------------------

# DEPENDABOT_INTERVAL=weekly        # daily, weekly, monthly, quarterly, semiannually, yearly
# DEPENDABOT_COOLDOWN_DAYS=3        # wait before proposing a new release (0 disables)
# DEPENDABOT_EXCLUDE=docker,pip     # ecosystems to leave out
