# Copy to .github/repo-tools.conf in a target repo, then re-run repo-ci /
# repo-dependabot. Plain KEY=VALUE lines; nothing here is executed by the
# scripts. Lists are comma or space separated. Everything is optional.
# GitHub ${{ }} expressions are refused (they'd be evaluated into commands);
# use environment variables such as $GITHUB_HEAD_REF in commands instead.

# --- CI ----------------------------------------------------------------------

# Languages to run, replacing auto-detection:
#   python node rust gradle maven terraform ansible shell
# LANGUAGES=python,shell

# Drop languages from the detected set.
# EXCLUDE=shell

# Directories a language's job runs in (one matrix entry each).
# PYTHON_DIRS=services/api,tools/cli
# NODE_DIRS=web

# Ubuntu packages to install before building (e.g. native libraries a crate,
# gem or Python wheel links against). APT_PACKAGES applies to every job;
# <LANGUAGE>_APT_PACKAGES replaces it for one language.
# APT_PACKAGES=libudev-dev libusb-1.0-0-dev pkg-config
# PYTHON_APT_PACKAGES=libpq-dev

# Runners to build on (one job per runner, alongside the directory matrix).
# OS applies to every language; <LANGUAGE>_OS replaces it for one. Default:
# ubuntu-latest. System packages are only installed on Linux runners.
# OS=ubuntu-latest,macos-latest
# SHELL_OS=ubuntu-latest

# Toolchain versions (otherwise taken from .python-version, .nvmrc,
# .java-version / .sdkmanrc, .terraform-version, or a sensible default).
# PYTHON_VERSION=3.12
# NODE_VERSION=22
# JAVA_VERSION=17
# TERRAFORM_VERSION=1.9.8
# RUST_VERSION=1.96                 # else rust-toolchain(.toml), else stable

# Replace a step's default command, or "skip" it. Key: <LANGUAGE>_<LINT|TEST|BUILD>.
# The command runs in the job's working directory.
# PYTHON_LINT=ruff check src
# PYTHON_TEST=pytest -m "not slow"
# NODE_BUILD=skip
# GRADLE_LINT=./gradlew ktlintCheck detekt
# MAVEN_LINT=./mvnw -B -ntp checkstyle:check
# TERRAFORM_TEST=skip
# ANSIBLE_TEST=molecule test
# RUST_AUDIT=skip                   # or a replacement for `cargo audit`
# RUST_MSRV=skip                    # or a replacement for the check on Cargo.toml's rust-version

# An extra command after lint, test and build, e.g. a smoke test. Point it at
# a script for anything longer than a line. Key: <LANGUAGE>_EXTRA.
# RUST_EXTRA=ci/smoke.sh

# Files to upload as a workflow artifact once the job passes, relative to the
# job's directory (globs work). Named <language>-<os>[-<dir>]. Pair with a
# _BUILD override if the defaults don't produce what you want to keep.
# RUST_BUILD=cargo build --release --locked
# RUST_ARTIFACTS=target/release/mytool

# Hand-written workflows the generated CI replaces. repo-ci deletes them in
# the same PR, so the old and new CI don't both run. File names in
# .github/workflows.
# REPLACE_WORKFLOWS=ci.yml

# --- Dependabot ----------------------------------------------------------------

# DEPENDABOT_INTERVAL=weekly        # daily, weekly, monthly, quarterly, semiannually, yearly
# DEPENDABOT_COOLDOWN_DAYS=3        # wait before proposing a new release (0 disables)
# DEPENDABOT_EXCLUDE=docker,pip     # ecosystems to leave out

# Ignore rules, one key per ecosystem (upper case, "-" becomes "_"). Entries are
# "dependency[:types]", types being major/minor/patch joined by "+". Without
# types the dependency is ignored entirely. Wildcards work.
# DEPENDABOT_IGNORE_CARGO=rand:major+minor, windows-*
# DEPENDABOT_IGNORE_NPM=@types/node:major
# DEPENDABOT_IGNORE_MAVEN=org.example:legacy-lib:major
# DEPENDABOT_IGNORE_GITHUB_ACTIONS=actions/checkout:major
