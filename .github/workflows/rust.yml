# Reusable Rust CI. Called by the repo-tools-ci.yml that bin/repo-ci generates.
#
# Toolchain: the toolchain input, else rust-toolchain(.toml), else stable.
# Lint:  cargo fmt --check, cargo clippy -D warnings
# Build: cargo build
# Test:  cargo test (unit, integration and doc tests)
# Audit: cargo audit against the RustSec advisory DB (separate job;
#        honours .cargo/audit.toml)
# Cargo commands get --locked when Cargo.lock is committed. The build cache is
# saved only from the default branch, so PR runs reuse it without churning it.
#
# Each *-command input replaces its default step; "skip" disables it.
name: Rust

on:
  workflow_call:
    inputs:
      working-directory:
        description: Crate or workspace directory, relative to the repo root.
        type: string
        default: "."
      apt-packages:
        description: Space-separated Ubuntu packages to install first (e.g. "libudev-dev pkg-config").
        type: string
        default: ""
      runs-on:
        description: Runner for the job (e.g. macos-latest). System packages are only installed on Linux.
        type: string
        default: ubuntu-latest
      extra-command:
        description: Runs after lint, test and build (e.g. "ci/smoke.sh"), in the working directory.
        type: string
        default: ""
      artifact-paths:
        description: Files, directories or globs to upload once the job passes, relative to the working directory. Space or newline separated.
        type: string
        default: ""
      artifact-name:
        description: Artifact name prefix; the runner OS and working directory are appended so matrix entries don't clash.
        type: string
        default: build
      toolchain:
        description: Rust toolchain (e.g. 1.96, stable). Empty uses rust-toolchain(.toml), else stable.
        type: string
        default: ""
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""
      audit-command:
        description: Replaces `cargo audit`; "skip" disables the audit job.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test & build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up failure annotations
        run: |
          # Writes the rt-run step shell used below; see the comment inside it.
          mkdir -p "$RUNNER_TEMP/rt-bin"
          cat >"$RUNNER_TEMP/rt-bin/rt-run" <<'RT_EOF'
          #!/usr/bin/env bash
          # Step shell ("shell: rt-run TITLE {0}"): runs the step script the way GitHub's
          # bash shell does and, if it fails, repeats the important part of its output
          # as an error annotation, so the failure can be read through the checks API
          # without downloading the log. Portable to bash 3.2 and BSD tools (macOS).
          script=${!#}
          title=${*:1:$#-1}
          log=$(mktemp)
          bash --noprofile --norc -eo pipefail "$script" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            esc=$(printf '\033')
            clean=$(sed -E "s/${esc}\[[0-9;]*[A-Za-z]//g" "$log" |
              grep -v -E '^[[:space:]]*(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding|Fresh|Blocking|Running|Finished|Installing|Installed|Resolved|Prepared|Audited) ' || true)
            # Prefer everything from the first compiler-style diagnostic onwards,
            # else the end of the output.
            diag=$(printf '%s\n' "$clean" | sed -n -E '/^(error|warning)(\[|:)/,$p' | head -n 200)
            body=${diag:-$(printf '%s\n' "$clean" | tail -n 100)}
            body=$(printf '%s' "$body" | head -c 30000)
            body=${body//'%'/'%25'}
            body=${body//$'\r'/'%0D'}
            body=${body//$'\n'/'%0A'}
            echo "::error title=${title:-Step} failed (exit $status)::$body"
          fi
          rm -f "$log"
          exit "$status"
          RT_EOF
          chmod +x "$RUNNER_TEMP/rt-bin/rt-run"
          echo "$RUNNER_TEMP/rt-bin" >>"$GITHUB_PATH"

      - name: Install system packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -ra pkgs <<<"$PACKAGES"
          for p in "${pkgs[@]}"; do
            [[ $p =~ ^[a-z0-9][a-z0-9.+:~=-]*$ ]] || { echo "::error::invalid package name: $p"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

      - name: Check for committed Cargo.lock
        run: |
          if [[ -f Cargo.lock ]]; then
            echo "Cargo.lock committed: using --locked"
            echo "RT_CARGO_LOCKED=true" >>"$GITHUB_ENV"
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy
          rust-src-dir: ${{ inputs.working-directory }}
          cache-save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Lint
        shell: rt-run Lint {0}
        env:
          CMD: ${{ inputs.lint-command }}
        run: |
          case $CMD in
            skip) echo "Lint skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          lock=()
          [[ ${RT_CARGO_LOCKED:-} != true ]] || lock=(--locked)
          # A rust-toolchain.toml may not list these; no-op if already installed.
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo clippy --workspace --all-targets "${lock[@]}" -- -D warnings

      - name: Build
        shell: rt-run Build {0}
        env:
          CMD: ${{ inputs.build-command }}
        run: |
          case $CMD in
            skip) echo "Build skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          lock=()
          [[ ${RT_CARGO_LOCKED:-} != true ]] || lock=(--locked)
          cargo build --workspace --all-targets "${lock[@]}"

      - name: Test
        shell: rt-run Test {0}
        env:
          CMD: ${{ inputs.test-command }}
        run: |
          case $CMD in
            skip) echo "Tests skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          lock=()
          [[ ${RT_CARGO_LOCKED:-} != true ]] || lock=(--locked)
          cargo test --workspace "${lock[@]}"

      - name: Extra checks
        shell: rt-run Extra checks {0}
        if: inputs.extra-command != '' && inputs.extra-command != 'skip'
        env:
          CMD: ${{ inputs.extra-command }}
        run: eval "$CMD"

      - name: Prepare artifact
        id: artifact
        if: inputs.artifact-paths != ''
        env:
          PATHS: ${{ inputs.artifact-paths }}
          NAME: ${{ inputs.artifact-name }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # upload-artifact resolves paths from the workspace root, not the working directory.
          dir=${WORKDIR#./}
          dir=${dir%/}
          [[ $dir != . ]] || dir=''
          read -ra paths <<<"${PATHS//$'\n'/ }"
          {
            echo 'paths<<RT_EOF'
            for p in "${paths[@]}"; do printf '%s%s\n' "${dir:+$dir/}" "$p"; done
            echo 'RT_EOF'
          } >>"$GITHUB_OUTPUT"
          os=$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")
          name="${NAME:-build}-$os${dir:+-$dir}"
          echo "name=${name//\//-}" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.artifact.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.paths }}
          if-no-files-found: error

  audit:
    name: cargo audit
    if: inputs.audit-command != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up failure annotations
        run: |
          # Writes the rt-run step shell used below; see the comment inside it.
          mkdir -p "$RUNNER_TEMP/rt-bin"
          cat >"$RUNNER_TEMP/rt-bin/rt-run" <<'RT_EOF'
          #!/usr/bin/env bash
          # Step shell ("shell: rt-run TITLE {0}"): runs the step script the way GitHub's
          # bash shell does and, if it fails, repeats the important part of its output
          # as an error annotation, so the failure can be read through the checks API
          # without downloading the log. Portable to bash 3.2 and BSD tools (macOS).
          script=${!#}
          title=${*:1:$#-1}
          log=$(mktemp)
          bash --noprofile --norc -eo pipefail "$script" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            esc=$(printf '\033')
            clean=$(sed -E "s/${esc}\[[0-9;]*[A-Za-z]//g" "$log" |
              grep -v -E '^[[:space:]]*(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding|Fresh|Blocking|Running|Finished|Installing|Installed|Resolved|Prepared|Audited) ' || true)
            # Prefer everything from the first compiler-style diagnostic onwards,
            # else the end of the output.
            diag=$(printf '%s\n' "$clean" | sed -n -E '/^(error|warning)(\[|:)/,$p' | head -n 200)
            body=${diag:-$(printf '%s\n' "$clean" | tail -n 100)}
            body=$(printf '%s' "$body" | head -c 30000)
            body=${body//'%'/'%25'}
            body=${body//$'\r'/'%0D'}
            body=${body//$'\n'/'%0A'}
            echo "::error title=${title:-Step} failed (exit $status)::$body"
          fi
          rm -f "$log"
          exit "$status"
          RT_EOF
          chmod +x "$RUNNER_TEMP/rt-bin/rt-run"
          echo "$RUNNER_TEMP/rt-bin" >>"$GITHUB_PATH"

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      - name: Audit dependencies
        shell: rt-run Audit dependencies {0}
        env:
          CMD: ${{ inputs.audit-command }}
        run: |
          if [[ -n $CMD ]]; then eval "$CMD"; else cargo audit; fi
