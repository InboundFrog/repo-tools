# Reusable Ansible CI. Called by the repo-tools-ci.yml that bin/repo-ci generates.
#
# Lint:  ansible-lint (honours .ansible-lint; installs collections from
#        requirements.yml itself, and includes yamllint + syntax checks)
# Test / Build: nothing by default; set test-command (e.g. molecule) if needed.
#
# Each *-command input replaces its default step; "skip" disables it.
name: Ansible

on:
  workflow_call:
    inputs:
      working-directory:
        description: Ansible project directory, relative to the repo root.
        type: string
        default: "."
      apt-packages:
        description: Space-separated Ubuntu packages to install first (e.g. "libudev-dev pkg-config").
        type: string
        default: ""
      runs-on:
        description: Runner for the job (e.g. macos-latest). System packages are only installed on Linux.
        type: string
        default: ubuntu-latest
      extra-command:
        description: Runs after lint, test and build (e.g. "ci/smoke.sh"), in the working directory.
        type: string
        default: ""
      artifact-paths:
        description: Files, directories or globs to upload once the job passes, relative to the working directory. Space or newline separated.
        type: string
        default: ""
      artifact-name:
        description: Artifact name prefix; the runner OS and working directory are appended so matrix entries don't clash.
        type: string
        default: build
      python-version:
        type: string
        default: "3.13"
      ansible-lint-version:
        description: Pin ansible-lint (e.g. 25.9.0). Empty installs the latest.
        type: string
        default: ""
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Lint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up failure annotations
        run: |
          # Writes the rt-run step shell used below; see the comment inside it.
          mkdir -p "$RUNNER_TEMP/rt-bin"
          cat >"$RUNNER_TEMP/rt-bin/rt-run" <<'RT_EOF'
          #!/usr/bin/env bash
          # Step shell ("shell: rt-run TITLE {0}"): runs the step script the way GitHub's
          # bash shell does and, if it fails, repeats the important part of its output
          # as an error annotation, so the failure can be read through the checks API
          # without downloading the log. Portable to bash 3.2 and BSD tools (macOS).
          script=${!#}
          title=${*:1:$#-1}
          log=$(mktemp)
          bash --noprofile --norc -eo pipefail "$script" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            esc=$(printf '\033')
            clean=$(sed -E "s/${esc}\[[0-9;]*[A-Za-z]//g" "$log" |
              grep -v -E '^[[:space:]]*(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding|Fresh|Blocking|Running|Finished|Installing|Installed|Resolved|Prepared|Audited) ' || true)
            # Prefer everything from the first compiler-style diagnostic onwards,
            # else the end of the output.
            diag=$(printf '%s\n' "$clean" | sed -n -E '/^(error|warning)(\[|:)/,$p' | head -n 200)
            body=${diag:-$(printf '%s\n' "$clean" | tail -n 100)}
            body=$(printf '%s' "$body" | head -c 30000)
            body=${body//'%'/'%25'}
            body=${body//$'\r'/'%0D'}
            body=${body//$'\n'/'%0A'}
            echo "::error title=${title:-Step} failed (exit $status)::$body"
          fi
          rm -f "$log"
          exit "$status"
          RT_EOF
          chmod +x "$RUNNER_TEMP/rt-bin/rt-run"
          echo "$RUNNER_TEMP/rt-bin" >>"$GITHUB_PATH"

      - name: Install system packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -ra pkgs <<<"$PACKAGES"
          for p in "${pkgs[@]}"; do
            [[ $p =~ ^[a-z0-9][a-z0-9.+:~=-]*$ ]] || { echo "::error::invalid package name: $p"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ansible-lint
        env:
          VERSION: ${{ inputs.ansible-lint-version }}
        run: python -m pip install --quiet "ansible-lint${VERSION:+==$VERSION}"

      - name: Lint
        shell: rt-run Lint {0}
        env:
          CMD: ${{ inputs.lint-command }}
        run: |
          case $CMD in
            skip) echo "Lint skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          ansible-lint

      - name: Test
        shell: rt-run Test {0}
        if: inputs.test-command != '' && inputs.test-command != 'skip'
        env:
          CMD: ${{ inputs.test-command }}
        run: eval "$CMD"

      - name: Build
        shell: rt-run Build {0}
        if: inputs.build-command != '' && inputs.build-command != 'skip'
        env:
          CMD: ${{ inputs.build-command }}
        run: eval "$CMD"

      - name: Extra checks
        shell: rt-run Extra checks {0}
        if: inputs.extra-command != '' && inputs.extra-command != 'skip'
        env:
          CMD: ${{ inputs.extra-command }}
        run: eval "$CMD"

      - name: Prepare artifact
        id: artifact
        if: inputs.artifact-paths != ''
        env:
          PATHS: ${{ inputs.artifact-paths }}
          NAME: ${{ inputs.artifact-name }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # upload-artifact resolves paths from the workspace root, not the working directory.
          dir=${WORKDIR#./}
          dir=${dir%/}
          [[ $dir != . ]] || dir=''
          read -ra paths <<<"${PATHS//$'\n'/ }"
          {
            echo 'paths<<RT_EOF'
            for p in "${paths[@]}"; do printf '%s%s\n' "${dir:+$dir/}" "$p"; done
            echo 'RT_EOF'
          } >>"$GITHUB_OUTPUT"
          os=$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")
          name="${NAME:-build}-$os${dir:+-$dir}"
          echo "name=${name//\//-}" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.artifact.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.paths }}
          if-no-files-found: error
