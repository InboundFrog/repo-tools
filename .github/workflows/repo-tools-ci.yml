# CI for repo-tools itself. Hand-written (no "Managed by" marker), so running
# bin/repo-ci against this repo leaves it alone. Exposes the same "CI OK"
# check as generated workflows, so repo-protect works here too.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    # Dogfood the reusable workflow from this checkout.
    uses: ./.github/workflows/shell.yml

  tests:
    name: Workflow lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        # Release tarball checked against a pinned SHA-256 (from the release's
        # actionlint_<version>_checksums.txt); bump both together. Tags can be
        # moved, so neither the tarball nor a script fetched by tag is trusted as-is.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # linux_amd64
        run: |
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >>"$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color

      - name: Run tests
        run: tests/run-tests.sh

  ci-ok:
    name: CI OK
    if: always()
    needs: [shell, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
