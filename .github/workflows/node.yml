# Reusable Node.js / TypeScript CI. Called by the repo-tools-ci.yml that bin/repo-ci generates.
#
# Package manager from the lockfile: pnpm-lock.yaml -> pnpm, yarn.lock -> yarn, else npm.
# Lint:  runs whichever of the lint, typecheck, type-check and format:check scripts
#        exist; with none, falls back to `tsc --noEmit` for TypeScript projects.
# Test:  the test script, if any (npm's placeholder "no test specified" is ignored).
# Build: the build script, if any.
#
# Each *-command input replaces its default step; "skip" disables it.
name: Node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory, relative to the repo root.
        type: string
        default: "."
      apt-packages:
        description: Space-separated Ubuntu packages to install first (e.g. "libudev-dev pkg-config").
        type: string
        default: ""
      runs-on:
        description: Runner for the job (e.g. macos-latest). System packages are only installed on Linux.
        type: string
        default: ubuntu-latest
      extra-command:
        description: Runs after lint, test and build (e.g. "ci/smoke.sh"), in the working directory.
        type: string
        default: ""
      artifact-paths:
        description: Files, directories or globs to upload once the job passes, relative to the working directory. Space or newline separated.
        type: string
        default: ""
      artifact-name:
        description: Artifact name prefix; the runner OS and working directory are appended so matrix entries don't clash.
        type: string
        default: build
      node-version:
        description: Node version. Empty uses .nvmrc / .node-version, else the latest LTS.
        type: string
        default: ""
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""

permissions:
  contents: read

# Tool versions installed by this workflow. Pinned so every caller runs the same,
# reviewed release; Dependabot can't see these, so bump them by hand.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  RT_COREPACK_VERSION: 0.36.0

jobs:
  check:
    name: Lint, test & build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up failure annotations
        run: |
          # Writes the rt-run step shell used below; see the comment inside it.
          mkdir -p "$RUNNER_TEMP/rt-bin"
          cat >"$RUNNER_TEMP/rt-bin/rt-run" <<'RT_EOF'
          #!/usr/bin/env bash
          # Step shell ("shell: rt-run TITLE {0}"): runs the step script the way GitHub's
          # bash shell does and, if it fails, repeats the important part of its output
          # as an error annotation, so the failure can be read through the checks API
          # without downloading the log. Portable to bash 3.2 and BSD tools (macOS).
          script=${!#}
          title=${*:1:$#-1}
          log=$(mktemp)
          bash --noprofile --norc -eo pipefail "$script" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            esc=$(printf '\033')
            clean=$(sed -E "s/${esc}\[[0-9;]*[A-Za-z]//g" "$log" |
              grep -v -E '^[[:space:]]*(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding|Fresh|Blocking|Running|Finished|Installing|Installed|Resolved|Prepared|Audited) ' || true)
            # Prefer everything from the first compiler-style diagnostic onwards,
            # else the end of the output.
            diag=$(printf '%s\n' "$clean" | sed -n -E '/^(error|warning)(\[|:)/,$p' | head -n 200)
            body=${diag:-$(printf '%s\n' "$clean" | tail -n 100)}
            body=$(printf '%s' "$body" | head -c 30000)
            body=${body//'%'/'%25'}
            body=${body//$'\r'/'%0D'}
            body=${body//$'\n'/'%0A'}
            echo "::error title=${title:-Step} failed (exit $status)::$body"
          fi
          rm -f "$log"
          exit "$status"
          RT_EOF
          chmod +x "$RUNNER_TEMP/rt-bin/rt-run"
          echo "$RUNNER_TEMP/rt-bin" >>"$GITHUB_PATH"

      - name: Install system packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -ra pkgs <<<"$PACKAGES"
          for p in "${pkgs[@]}"; do
            [[ $p =~ ^[a-z0-9][a-z0-9.+:~=-]*$ ]] || { echo "::error::invalid package name: $p"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

      - name: Detect toolchain
        id: detect
        env:
          REQUESTED: ${{ inputs.node-version }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          if [[ -f pnpm-lock.yaml ]]; then pm=pnpm
          elif [[ -f yarn.lock ]]; then pm=yarn
          else pm=npm
          fi
          if [[ -n $REQUESTED ]]; then v=$REQUESTED
          elif [[ -f .nvmrc ]]; then v=$(head -n1 .nvmrc)
          elif [[ -f .node-version ]]; then v=$(head -n1 .node-version)
          else v='lts/*'
          fi
          cache='' lock=''
          if [[ $pm == npm && -f package-lock.json ]]; then
            cache=npm lock="${WORKDIR%/}/package-lock.json"
          fi
          {
            echo "pm=$pm"
            echo "version=$v"
            echo "cache=$cache"
            echo "lockfile=$lock"
          } >>"$GITHUB_OUTPUT"

          # Helpers shared by the steps below.
          cat >"$RUNNER_TEMP/node-helpers.sh" <<EOF
          PM=$pm
          EOF
          cat >>"$RUNNER_TEMP/node-helpers.sh" <<'EOF'
          has_script() {
            node -e 'const s = (require("./package.json").scripts || {})[process.argv[1]];
              process.exit(s && !/no test specified/.test(s) ? 0 : 1)' "$1"
          }
          run_script() { "$PM" run "$1"; }
          EOF

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.detect.outputs.version }}
          cache: ${{ steps.detect.outputs.cache }}
          cache-dependency-path: ${{ steps.detect.outputs.lockfile }}

      - name: Install dependencies
        shell: rt-run Install dependencies {0}
        run: |
          source "$RUNNER_TEMP/node-helpers.sh"
          if [[ $PM != npm ]]; then
            command -v corepack >/dev/null || npm install -g "corepack@$RT_COREPACK_VERSION"
            corepack enable
          fi
          case $PM in
            npm)
              if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then npm ci; else npm install; fi ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              if [[ $(yarn --version) == 1.* ]]; then yarn install --frozen-lockfile
              else yarn install --immutable
              fi ;;
          esac

      - name: Lint
        shell: rt-run Lint {0}
        env:
          CMD: ${{ inputs.lint-command }}
        run: |
          case $CMD in
            skip) echo "Lint skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          source "$RUNNER_TEMP/node-helpers.sh"
          ran=0
          for s in lint typecheck type-check format:check; do
            if has_script "$s"; then run_script "$s"; ran=1; fi
          done
          if ((!ran)) && [[ -f tsconfig.json && -x node_modules/.bin/tsc ]]; then
            node_modules/.bin/tsc --noEmit
          elif ((!ran)); then
            echo "No lint scripts found"
          fi

      - name: Test
        shell: rt-run Test {0}
        env:
          CMD: ${{ inputs.test-command }}
        run: |
          case $CMD in
            skip) echo "Tests skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          source "$RUNNER_TEMP/node-helpers.sh"
          if has_script test; then run_script test; else echo "No test script"; fi

      - name: Build
        shell: rt-run Build {0}
        env:
          CMD: ${{ inputs.build-command }}
        run: |
          case $CMD in
            skip) echo "Build skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          source "$RUNNER_TEMP/node-helpers.sh"
          if has_script build; then run_script build; else echo "No build script"; fi

      - name: Extra checks
        shell: rt-run Extra checks {0}
        if: inputs.extra-command != '' && inputs.extra-command != 'skip'
        env:
          CMD: ${{ inputs.extra-command }}
        run: eval "$CMD"

      - name: Prepare artifact
        id: artifact
        if: inputs.artifact-paths != ''
        env:
          PATHS: ${{ inputs.artifact-paths }}
          NAME: ${{ inputs.artifact-name }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # upload-artifact resolves paths from the workspace root, not the working directory.
          dir=${WORKDIR#./}
          dir=${dir%/}
          [[ $dir != . ]] || dir=''
          read -ra paths <<<"${PATHS//$'\n'/ }"
          # Unique delimiter, so no path can end the multiline value early.
          delim="RT_EOF_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "paths<<$delim"
            for p in "${paths[@]}"; do printf '%s%s\n' "${dir:+$dir/}" "$p"; done
            echo "$delim"
          } >>"$GITHUB_OUTPUT"
          os=$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")
          name="${NAME:-build}-$os${dir:+-$dir}"
          echo "name=${name//\//-}" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.artifact.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.paths }}
          if-no-files-found: error
