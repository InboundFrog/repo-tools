# Reusable Terraform CI. Called by the repo-tools-ci.yml that bin/repo-ci generates.
#
# Lint:  terraform fmt -check, plus tflint (uses .tflint.hcl if present)
# Build: init -backend=false + validate in every directory containing .tf files
# Test:  terraform test in every directory containing .tftest.hcl files
#
# Each *-command input replaces its default step; "skip" disables it.
name: Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan for Terraform, relative to the repo root.
        type: string
        default: "."
      apt-packages:
        description: Space-separated Ubuntu packages to install first (e.g. "libudev-dev pkg-config").
        type: string
        default: ""
      runs-on:
        description: Runner for the job (e.g. macos-latest). System packages are only installed on Linux.
        type: string
        default: ubuntu-latest
      extra-command:
        description: Runs after lint, test and build (e.g. "ci/smoke.sh"), in the working directory.
        type: string
        default: ""
      artifact-paths:
        description: Files, directories or globs to upload once the job passes, relative to the working directory. Space or newline separated.
        type: string
        default: ""
      artifact-name:
        description: Artifact name prefix; the runner OS and working directory are appended so matrix entries don't clash.
        type: string
        default: build
      terraform-version:
        description: Terraform version. Empty uses .terraform-version, else latest.
        type: string
        default: ""
      tflint:
        description: Run tflint as part of lint.
        type: boolean
        default: true
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  check:
    name: Lint, validate & test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -ra pkgs <<<"$PACKAGES"
          for p in "${pkgs[@]}"; do
            [[ $p =~ ^[a-z0-9][a-z0-9.+:~=-]*$ ]] || { echo "::error::invalid package name: $p"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

      - name: Resolve Terraform version
        id: tf
        env:
          REQUESTED: ${{ inputs.terraform-version }}
        run: |
          if [[ -n $REQUESTED ]]; then v=$REQUESTED
          elif [[ -f .terraform-version ]]; then v=$(head -n1 .terraform-version)
          else v=latest
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - if: inputs.tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Lint
        env:
          CMD: ${{ inputs.lint-command }}
          TFLINT: ${{ inputs.tflint }}
        run: |
          case $CMD in
            skip) echo "Lint skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          terraform fmt -check -recursive -diff
          if [[ $TFLINT == true ]]; then
            tflint --init
            tflint --recursive --format compact
          fi

      - name: Validate
        env:
          CMD: ${{ inputs.build-command }}
        run: |
          case $CMD in
            skip) echo "Validate skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          failed=0
          while IFS= read -r d; do
            echo "::group::$d"
            if ! (cd "$d" && terraform init -backend=false -no-color >/dev/null && terraform validate -no-color); then
              echo "::error::terraform validate failed in $d"
              failed=1
            fi
            echo "::endgroup::"
          done < <(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          exit "$failed"

      - name: Test
        env:
          CMD: ${{ inputs.test-command }}
        run: |
          case $CMD in
            skip) echo "Tests skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          # Portable to macOS runners: bash 3.2 (no mapfile) and BSD find (no -printf).
          dirs=()
          while IFS= read -r d; do dirs+=("$d"); done < <(
            find . -name '*.tftest.hcl' -not -path '*/.terraform/*' -exec dirname {} \; |
              sed -E 's#/tests$##' | sort -u
          )
          if ((${#dirs[@]} == 0)); then echo "No terraform tests"; exit 0; fi
          for d in "${dirs[@]}"; do
            echo "::group::$d"
            (cd "$d" && terraform init -backend=false -no-color >/dev/null && terraform test -no-color)
            echo "::endgroup::"
          done

      - name: Extra checks
        if: inputs.extra-command != '' && inputs.extra-command != 'skip'
        env:
          CMD: ${{ inputs.extra-command }}
        run: eval "$CMD"

      - name: Prepare artifact
        id: artifact
        if: inputs.artifact-paths != ''
        env:
          PATHS: ${{ inputs.artifact-paths }}
          NAME: ${{ inputs.artifact-name }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # upload-artifact resolves paths from the workspace root, not the working directory.
          dir=${WORKDIR#./}
          dir=${dir%/}
          [[ $dir != . ]] || dir=''
          read -ra paths <<<"${PATHS//$'\n'/ }"
          {
            echo 'paths<<RT_EOF'
            for p in "${paths[@]}"; do printf '%s%s\n' "${dir:+$dir/}" "$p"; done
            echo 'RT_EOF'
          } >>"$GITHUB_OUTPUT"
          os=$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")
          name="${NAME:-build}-$os${dir:+-$dir}"
          echo "name=${name//\//-}" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.artifact.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.paths }}
          if-no-files-found: error
