# Reusable Java / Kotlin CI (Gradle or Maven). Called by the repo-tools-ci.yml
# that bin/repo-ci generates.
#
#          Gradle (needs ./gradlew)        Maven (./mvnw if present, else mvn)
# Lint:    ./gradlew check -x test          (none by default; plugins bound to
# Test:    ./gradlew test                    `verify` still run in the build step)
# Build:   ./gradlew assemble               mvn test / mvn verify -DskipTests
#
# Lint picks up whatever the build configures (ktlint, detekt, spotless, checkstyle...).
# Each *-command input replaces its default step; "skip" disables it.
name: JVM

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory, relative to the repo root.
        type: string
        default: "."
      apt-packages:
        description: Space-separated Ubuntu packages to install first (e.g. "libudev-dev pkg-config").
        type: string
        default: ""
      runs-on:
        description: Runner for the job (e.g. macos-latest). System packages are only installed on Linux.
        type: string
        default: ubuntu-latest
      extra-command:
        description: Runs after lint, test and build (e.g. "ci/smoke.sh"), in the working directory.
        type: string
        default: ""
      artifact-paths:
        description: Files, directories or globs to upload once the job passes, relative to the working directory. Space or newline separated.
        type: string
        default: ""
      artifact-name:
        description: Artifact name prefix; the runner OS and working directory are appended so matrix entries don't clash.
        type: string
        default: build
      build-tool:
        description: gradle or maven. Empty detects from the files present.
        type: string
        default: ""
      java-version:
        description: JDK version. Empty uses .java-version / .sdkmanrc, else 21.
        type: string
        default: ""
      java-distribution:
        type: string
        default: temurin
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Lint, test & build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -ra pkgs <<<"$PACKAGES"
          for p in "${pkgs[@]}"; do
            [[ $p =~ ^[a-z0-9][a-z0-9.+:~=-]*$ ]] || { echo "::error::invalid package name: $p"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

      - name: Detect toolchain
        id: detect
        env:
          TOOL: ${{ inputs.build-tool }}
          REQUESTED: ${{ inputs.java-version }}
        run: |
          if [[ -z $TOOL ]]; then
            if compgen -G 'build.gradle*' >/dev/null || compgen -G 'settings.gradle*' >/dev/null; then TOOL=gradle
            elif [[ -f pom.xml ]]; then TOOL=maven
            else echo "::error::No Gradle or Maven build found"; exit 1
            fi
          fi
          if [[ -n $REQUESTED ]]; then v=$REQUESTED
          elif [[ -f .java-version ]]; then v=$(head -n1 .java-version)
          elif [[ -f .sdkmanrc ]] && grep -q '^java=' .sdkmanrc; then
            v=$(sed -nE 's/^java=([0-9]+).*/\1/p' .sdkmanrc)
          else v=21
          fi
          if [[ $TOOL == gradle ]]; then
            [[ -f gradlew ]] || { echo "::error::Gradle project without ./gradlew wrapper"; exit 1; }
            chmod +x gradlew
            run=./gradlew
          else
            if [[ -f mvnw ]]; then chmod +x mvnw; run=./mvnw; else run=mvn; fi
          fi
          { echo "tool=$TOOL"; echo "version=$v"; echo "run=$run"; } >>"$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ steps.detect.outputs.version }}
          cache: ${{ steps.detect.outputs.tool == 'maven' && 'maven' || '' }}

      - if: steps.detect.outputs.tool == 'gradle'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint
        env:
          CMD: ${{ inputs.lint-command }}
          TOOL: ${{ steps.detect.outputs.tool }}
          RUN: ${{ steps.detect.outputs.run }}
        run: |
          case $CMD in
            skip) echo "Lint skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          if [[ $TOOL == gradle ]]; then
            "$RUN" check -x test --continue
          else
            echo "No default Maven lint; plugins bound to 'verify' run in the build step"
          fi

      - name: Test
        env:
          CMD: ${{ inputs.test-command }}
          TOOL: ${{ steps.detect.outputs.tool }}
          RUN: ${{ steps.detect.outputs.run }}
        run: |
          case $CMD in
            skip) echo "Tests skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          if [[ $TOOL == gradle ]]; then "$RUN" test --continue
          else "$RUN" -B -ntp test
          fi

      - name: Build
        env:
          CMD: ${{ inputs.build-command }}
          TOOL: ${{ steps.detect.outputs.tool }}
          RUN: ${{ steps.detect.outputs.run }}
        run: |
          case $CMD in
            skip) echo "Build skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          if [[ $TOOL == gradle ]]; then "$RUN" assemble
          else "$RUN" -B -ntp verify -DskipTests
          fi

      - name: Extra checks
        if: inputs.extra-command != '' && inputs.extra-command != 'skip'
        env:
          CMD: ${{ inputs.extra-command }}
        run: eval "$CMD"

      - name: Prepare artifact
        id: artifact
        if: inputs.artifact-paths != ''
        env:
          PATHS: ${{ inputs.artifact-paths }}
          NAME: ${{ inputs.artifact-name }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # upload-artifact resolves paths from the workspace root, not the working directory.
          dir=${WORKDIR#./}
          dir=${dir%/}
          [[ $dir != . ]] || dir=''
          read -ra paths <<<"${PATHS//$'\n'/ }"
          {
            echo 'paths<<RT_EOF'
            for p in "${paths[@]}"; do printf '%s%s\n' "${dir:+$dir/}" "$p"; done
            echo 'RT_EOF'
          } >>"$GITHUB_OUTPUT"
          os=$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")
          name="${NAME:-build}-$os${dir:+-$dir}"
          echo "name=${name//\//-}" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.artifact.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.paths }}
          if-no-files-found: error
