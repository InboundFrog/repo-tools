# Reusable shell script CI. Called by the repo-tools-ci.yml that bin/repo-ci
# generates (repo-tools also uses it on itself).
#
# Lint:  shellcheck on tracked *.sh / *.bash files and extensionless scripts
#        with a sh/bash shebang (honours .shellcheckrc)
# Test:  bats, if any *.bats files are tracked
#
# Each *-command input replaces its default step; "skip" disables it.
name: Shell

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan, relative to the repo root.
        type: string
        default: "."
      apt-packages:
        description: Space-separated Ubuntu packages to install first (e.g. "libudev-dev pkg-config").
        type: string
        default: ""
      runs-on:
        description: Runner for the job (e.g. macos-latest). System packages are only installed on Linux.
        type: string
        default: ubuntu-latest
      extra-command:
        description: Runs after lint, test and build (e.g. "ci/smoke.sh"), in the working directory.
        type: string
        default: ""
      artifact-paths:
        description: Files, directories or globs to upload once the job passes, relative to the working directory. Space or newline separated.
        type: string
        default: ""
      artifact-name:
        description: Artifact name prefix; the runner OS and working directory are appended so matrix entries don't clash.
        type: string
        default: build
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Lint & test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -ra pkgs <<<"$PACKAGES"
          for p in "${pkgs[@]}"; do
            [[ $p =~ ^[a-z0-9][a-z0-9.+:~=-]*$ ]] || { echo "::error::invalid package name: $p"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

      - name: Lint
        env:
          CMD: ${{ inputs.lint-command }}
        run: |
          case $CMD in
            skip) echo "Lint skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          shebang='^#!.*(/|[[:space:]])(ba|da|k)?sh([[:space:]]|$)'
          files=()
          while IFS= read -r f; do
            case $f in
              *.sh | *.bash) files+=("$f") ;;
              */*.* | *.*) ;;
              *)
                [[ -f $f && ! -L $f ]] || continue
                IFS= read -r first <"$f" 2>/dev/null || continue
                if [[ $first =~ $shebang ]]; then files+=("$f"); fi
                ;;
            esac
          done < <(git ls-files .)
          if ((${#files[@]} == 0)); then echo "No shell scripts found"; exit 0; fi
          printf 'Checking %d file(s)\n' "${#files[@]}"
          command -v shellcheck >/dev/null || brew install shellcheck >/dev/null
          shellcheck --version | sed -n 2p
          shellcheck --external-sources --source-path=SCRIPTDIR "${files[@]}"

      - name: Test
        env:
          CMD: ${{ inputs.test-command }}
        run: |
          case $CMD in
            skip) echo "Tests skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          tests=()
          while IFS= read -r f; do tests+=("$f"); done < <(git ls-files '*.bats') # bash 3.2 on macOS: no mapfile
          if ((${#tests[@]} == 0)); then echo "No bats tests"; exit 0; fi
          if [[ $RUNNER_OS == macOS ]]; then brew install bats-core >/dev/null
          else sudo apt-get update -qq && sudo apt-get install -y -qq bats >/dev/null
          fi
          bats "${tests[@]}"

      - name: Build
        if: inputs.build-command != '' && inputs.build-command != 'skip'
        env:
          CMD: ${{ inputs.build-command }}
        run: eval "$CMD"

      - name: Extra checks
        if: inputs.extra-command != '' && inputs.extra-command != 'skip'
        env:
          CMD: ${{ inputs.extra-command }}
        run: eval "$CMD"

      - name: Prepare artifact
        id: artifact
        if: inputs.artifact-paths != ''
        env:
          PATHS: ${{ inputs.artifact-paths }}
          NAME: ${{ inputs.artifact-name }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # upload-artifact resolves paths from the workspace root, not the working directory.
          dir=${WORKDIR#./}
          dir=${dir%/}
          [[ $dir != . ]] || dir=''
          read -ra paths <<<"${PATHS//$'\n'/ }"
          {
            echo 'paths<<RT_EOF'
            for p in "${paths[@]}"; do printf '%s%s\n' "${dir:+$dir/}" "$p"; done
            echo 'RT_EOF'
          } >>"$GITHUB_OUTPUT"
          os=$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")
          name="${NAME:-build}-$os${dir:+-$dir}"
          echo "name=${name//\//-}" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.artifact.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.paths }}
          if-no-files-found: error
