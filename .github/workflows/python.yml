# Reusable Python CI. Called by the repo-tools-ci.yml that bin/repo-ci generates.
#
# Install: uv.lock -> uv sync; poetry.lock -> poetry install; otherwise a venv
#          with the project (+ dev/test extras) and any requirements*.txt.
# Lint:    ruff check; ruff format --check too if the project configures ruff.
# Test:    pytest (no tests collected counts as a pass).
# Build:   uv build, if the project declares a build system.
#
# Each *-command input replaces its default step; "skip" disables it.
name: Python

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory, relative to the repo root.
        type: string
        default: "."
      apt-packages:
        description: Space-separated Ubuntu packages to install first (e.g. "libudev-dev pkg-config").
        type: string
        default: ""
      runs-on:
        description: Runner for the job (e.g. macos-latest). System packages are only installed on Linux.
        type: string
        default: ubuntu-latest
      extra-command:
        description: Runs after lint, test and build (e.g. "ci/smoke.sh"), in the working directory.
        type: string
        default: ""
      artifact-paths:
        description: Files, directories or globs to upload once the job passes, relative to the working directory. Space or newline separated.
        type: string
        default: ""
      artifact-name:
        description: Artifact name prefix; the runner OS and working directory are appended so matrix entries don't clash.
        type: string
        default: build
      python-version:
        description: Python version. Empty uses .python-version, else 3.13.
        type: string
        default: ""
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Lint, test & build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -ra pkgs <<<"$PACKAGES"
          for p in "${pkgs[@]}"; do
            [[ $p =~ ^[a-z0-9][a-z0-9.+:~=-]*$ ]] || { echo "::error::invalid package name: $p"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

      - name: Resolve Python version
        id: python
        env:
          REQUESTED: ${{ inputs.python-version }}
        run: |
          if [[ -n $REQUESTED ]]; then v=$REQUESTED
          elif [[ -f .python-version ]]; then v=$(head -n1 .python-version)
          else v=3.13
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: |
          if [[ -f uv.lock ]]; then
            uv sync --all-extras --dev
          elif [[ -f poetry.lock ]]; then
            POETRY_VIRTUALENVS_IN_PROJECT=true uvx poetry install --no-interaction --all-extras
          else
            uv venv .venv --python "$(command -v python)"
            export VIRTUAL_ENV=$PWD/.venv
            if [[ -f pyproject.toml || -f setup.py ]]; then
              uv pip install -e '.[dev,test]' || uv pip install -e .
            fi
            for f in requirements.txt requirements-dev.txt requirements-test.txt dev-requirements.txt test-requirements.txt; do
              if [[ -f $f ]]; then uv pip install -r "$f"; fi
            done
          fi
          echo "VIRTUAL_ENV=$PWD/.venv" >>"$GITHUB_ENV"
          echo "$PWD/.venv/bin" >>"$GITHUB_PATH"

      - name: Lint
        env:
          CMD: ${{ inputs.lint-command }}
        run: |
          case $CMD in
            skip) echo "Lint skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          ruff() { if command -v ruff >/dev/null; then command ruff "$@"; else uvx ruff "$@"; fi; }
          ruff check --output-format=github .
          if [[ -f ruff.toml || -f .ruff.toml ]] || grep -qs '^\[tool\.ruff' pyproject.toml; then
            ruff format --check .
          fi

      - name: Test
        env:
          CMD: ${{ inputs.test-command }}
        run: |
          case $CMD in
            skip) echo "Tests skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          python -c 'import pytest' 2>/dev/null || uv pip install pytest
          rc=0
          python -m pytest || rc=$?
          if ((rc == 5)); then echo "No tests collected"; exit 0; fi
          exit "$rc"

      - name: Build
        env:
          CMD: ${{ inputs.build-command }}
        run: |
          case $CMD in
            skip) echo "Build skipped"; exit 0 ;;
            ?*) eval "$CMD"; exit ;;
          esac
          if grep -qs '^\[build-system\]' pyproject.toml || [[ -f setup.py ]]; then
            uv build
          else
            echo "No build system declared; nothing to build"
          fi

      - name: Extra checks
        if: inputs.extra-command != '' && inputs.extra-command != 'skip'
        env:
          CMD: ${{ inputs.extra-command }}
        run: eval "$CMD"

      - name: Prepare artifact
        id: artifact
        if: inputs.artifact-paths != ''
        env:
          PATHS: ${{ inputs.artifact-paths }}
          NAME: ${{ inputs.artifact-name }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # upload-artifact resolves paths from the workspace root, not the working directory.
          dir=${WORKDIR#./}
          dir=${dir%/}
          [[ $dir != . ]] || dir=''
          read -ra paths <<<"${PATHS//$'\n'/ }"
          {
            echo 'paths<<RT_EOF'
            for p in "${paths[@]}"; do printf '%s%s\n' "${dir:+$dir/}" "$p"; done
            echo 'RT_EOF'
          } >>"$GITHUB_OUTPUT"
          os=$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")
          name="${NAME:-build}-$os${dir:+-$dir}"
          echo "name=${name//\//-}" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.artifact.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.paths }}
          if-no-files-found: error
