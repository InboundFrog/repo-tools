# Dependabot for repo-tools itself. The github-actions entry keeps the actions
# in the reusable workflows current; those bumps ship in the next release.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
